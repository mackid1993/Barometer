name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, for example 0.1.0"
        required: true
        type: string
      notes:
        description: "Release notes in Markdown"
        required: false
        default: ""
        type: string
      notarize:
        description: "Notarize and staple the DMG (off unless explicitly selected)"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  macos:
    uses: ./.github/workflows/macos.yml
    with:
      version: ${{ inputs.version }}
      notarize: ${{ inputs.notarize }}
    secrets: inherit

  release:
    needs: macos
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: barometer-dmg
          path: staging

      - name: Validate version and artifact
        env:
          RAW_VERSION: ${{ inputs.version }}
        run: |
          VERSION=$(printf '%s' "$RAW_VERSION" | xargs)
          if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Version '$VERSION' is not major.minor.patch" >&2
            exit 1
          fi
          test -f "staging/Barometer-${VERSION}.dmg"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Prepare release notes
        env:
          NOTES: ${{ inputs.notes }}
        run: |
          if [ -n "$(printf '%s' "$NOTES" | tr -d '[:space:]')" ]; then
            printf '%s\n' "$NOTES" > notes.md
          else
            printf 'Barometer %s\n' "$VERSION" > notes.md
          fi

      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v${VERSION}"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" \
              --draft \
              --target "$GITHUB_SHA" \
              --title "Barometer ${VERSION}" \
              --notes-file notes.md
          else
            gh release edit "$TAG" --notes-file notes.md
          fi
          gh release upload "$TAG" "staging/Barometer-${VERSION}.dmg" --clobber
