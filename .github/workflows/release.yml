name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, for example 0.1.0"
        required: true
        type: string
      notes:
        description: "Release notes in Markdown"
        required: false
        default: ""
        type: string
      notarize:
        description: "Notarize and staple the DMG (off unless explicitly selected)"
        required: false
        default: false
        type: boolean
      replace_published:
        description: "Replace the published release asset and retarget its tag"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  macos:
    uses: ./.github/workflows/macos.yml
    with:
      version: ${{ inputs.version }}
      notarize: ${{ inputs.notarize }}
    secrets: inherit

  release:
    needs: macos
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: barometer-dmg
          path: staging

      - name: Validate version and artifact
        env:
          RAW_VERSION: ${{ inputs.version }}
        run: |
          VERSION=$(printf '%s' "$RAW_VERSION" | xargs)
          if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Version '$VERSION' is not major.minor.patch" >&2
            exit 1
          fi
          test -f "staging/Barometer-${VERSION}.dmg"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Prepare release notes
        env:
          NOTES: ${{ inputs.notes }}
        run: |
          if [ -n "$(printf '%s' "$NOTES" | tr -d '[:space:]')" ]; then
            printf '%s\n' "$NOTES" > notes.md
          else
            printf 'Barometer %s\n' "$VERSION" > notes.md
          fi

      # New releases remain drafts. An already-published release is immutable unless the manual
      # dispatch explicitly enables replacement; that path also retargets the tag to the tested source.
      - name: Prepare GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          REPLACE_PUBLISHED: ${{ inputs.replace_published }}
        run: |
          TAG="v${VERSION}"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" \
              --target "$GITHUB_SHA" \
              --draft \
              --title "Barometer ${VERSION}" \
              --notes-file notes.md
          else
            if [ "$(gh release view "$TAG" --json isDraft -q .isDraft)" != "true" ]; then
              if [ "$REPLACE_PUBLISHED" != "true" ]; then
                echo "::error::$TAG is already published; enable the explicit replacement input or bump the version" >&2
                exit 1
              fi
              gh api --method PATCH "repos/${GITHUB_REPOSITORY}/git/refs/tags/${TAG}" \
                -f sha="$GITHUB_SHA" \
                -F force=true >/dev/null
            fi
            gh release edit "$TAG" \
              --title "Barometer ${VERSION}" \
              --notes-file notes.md
          fi
          gh release upload "$TAG" "staging/Barometer-${VERSION}.dmg" --clobber
          echo "Release $TAG is ready at $(gh release view "$TAG" --json url -q .url)" >> "$GITHUB_STEP_SUMMARY"
