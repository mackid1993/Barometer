name: Tests

on:
  workflow_call:

permissions:
  contents: read

env:
  DEVELOPER_DIR: /Applications/Xcode.app/Contents/Developer

jobs:
  test:
    runs-on: xcode-27
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Report toolchain
        run: swift --version

      - name: Check source invariants
        run: python3 Scripts/check-source-invariants.py

      - name: Check C security diagnostics
        run: make security-audit

      - name: Run tests
        run: make test

      - name: Run panel and graph memory regression
        run: python3 Scripts/benchmark-popover-memory.py
